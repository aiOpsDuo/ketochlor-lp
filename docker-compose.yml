# Empacotamento de produção do ponto único de entrada (SDD § "Camadas e
# padrão arquitetural" → "Ponto único de entrada"; ver docs/DOCKER.md).
# O serviço `api` exige as variáveis de ambiente do Supabase abaixo — ver
# `.env.example` na raiz deste repositório (copie para `.env`, nunca
# commitado, ver .gitignore) e `apps/api/src/infrastructure/config/
# supabase-env.ts` para a validação exata. Compose lê o `.env` da raiz
# automaticamente para resolver `${VAR:?...}`: sem ele, `docker compose up`
# falha de imediato com uma mensagem clara, em vez de subir a `api` em
# crash-loop.
#
# `mysql`/`minio`: infraestrutura da migração para MySQL + MinIO
# auto-hospedados (tarefa `ajustes/migracao-mysql-infra-compose` do
# `agent_context/PLAN.md`). Puramente aditivo — o serviço `api` acima
# continua servindo contra Supabase até a tarefa `migracao-mysql-cutover-
# wiring` trocar o wiring dos adaptadores; até lá, `mysql`/`minio` só
# existem para as tarefas seguintes da migração poderem se conectar a eles.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?defina SUPABASE_URL no .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?defina SUPABASE_SERVICE_ROLE_KEY no .env}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?defina SUPABASE_JWT_SECRET no .env}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?defina SUPABASE_JWKS_URL no .env}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-images}
    # Sem `ports`: a API só é alcançada pela rede interna do compose (pelo
    # serviço `proxy`, via nome de serviço `api`), nunca diretamente do host.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env}
      # Lidas só pelo script de inicialização abaixo (`docker/mysql/initdb/`,
      # montado em `/docker-entrypoint-initdb.d`) — não são MYSQL_USER/
      # MYSQL_PASSWORD porque essas variáveis da imagem oficial concedem
      # GRANT ALL (superusuário) no banco, mais privilégio do que o usuário
      # de aplicação deve ter em runtime (ver comentário no script).
      MYSQL_APP_USER: ${MYSQL_APP_USER:?defina MYSQL_APP_USER no .env}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?defina MYSQL_APP_PASSWORD no .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    # Sem `ports`: só alcançável pela rede interna do compose (pelo nome de
    # serviço `mysql`) — mesmo padrão já usado pelo serviço `api`.
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      # A primeira subida (volume vazio) roda `initdb` + o script de criação
      # do usuário de aplicação antes do servidor aceitar conexão — medido
      # em ~90s neste ambiente de desenvolvimento; `start_period` maior
      # evita marcar o container como `unhealthy` só por causa desse boot
      # inicial (verificado de verdade, não só documentado — ver relato da
      # tarefa `ajustes/migracao-mysql-infra-compose`).
      start_period: 100s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio-data:/data
    # Sem `ports`: só alcançável pela rede interna do compose (pelo nome de
    # serviço `minio`) — mesmo padrão já usado pelo serviço `api`.
    healthcheck:
      # A imagem oficial não inclui mais curl/wget (só o binário `mc`, já
      # embarcado) — `mc ready local` é o healthcheck recomendado pelo
      # próprio MinIO no lugar de bater em /minio/health/live via HTTP.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Roda uma vez, cria o bucket de imagens do CMS se ainda não existir, e
  # sai — padrão recomendado pelo próprio MinIO para provisionar bucket no
  # startup do compose (um serviço `mc` de inicialização, não um servidor de
  # vida longa). Não publica nada nem expõe porta; só fala com `minio` pela
  # rede interna do compose.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-images}
    entrypoint: >
      /bin/sh -c "
      mc alias set cms http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"cms/$$MINIO_BUCKET\"
      "

volumes:
  mysql-data:
  minio-data:
