# Empacotamento de produção do ponto único de entrada (SDD § "Camadas e
# padrão arquitetural" → "Ponto único de entrada"; ver docs/DOCKER.md).
# O serviço `api` exige as variáveis de ambiente de MySQL/MinIO/auth própria
# abaixo — ver `.env.example` na raiz deste repositório (copie para `.env`,
# nunca commitado, ver .gitignore) e `apps/api/src/infrastructure/config/
# {mysql,minio,auth-jwt}-env.ts` para a validação exata. Compose lê o `.env`
# da raiz automaticamente para resolver `${VAR:?...}`: sem ele, `docker
# compose up` falha de imediato com uma mensagem clara, em vez de subir a
# `api` em crash-loop.
#
# `mysql`/`minio`: infraestrutura da migração para MySQL + MinIO
# auto-hospedados (tarefa `ajustes/migracao-mysql-infra-compose`; corte de
# fato — `api` servindo por eles no lugar do Supabase — na tarefa
# `ajustes/migracao-mysql-cutover-wiring`, `agent_context/PLAN.md`).
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env}
      MYSQL_APP_USER: ${MYSQL_APP_USER:?defina MYSQL_APP_USER no .env}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?defina MYSQL_APP_PASSWORD no .env}
      # Endpoint que o `S3Client` do servidor (`criarMinioClient`) usa tanto
      # para ASSINAR a URL de upload (`getSignedUrl`, SigV4 — o header
      # `Host` entra na assinatura, `X-Amz-SignedHeaders=host`) quanto para
      # montar `public_url` em `media_assets`. Por isso precisa já ser o
      # MESMO endpoint que um cliente de fora do compose (o navegador) vai
      # de fato usar no `PUT` — nunca o hostname interno `minio` (resolvível
      # só dentro da rede do compose; reescrever a URL depois de assinada
      # invalidaria a assinatura). Achado e correção registrados em
      # `agent_context/PLAN.md`, tarefa
      # `ajustes/migracao-mysql-minio-endpoint-publico`.
      #
      # Default `http://localhost:9000`: em desenvolvimento local, a mesma
      # máquina que roda `docker compose up` também publica a porta do
      # `minio` (ver serviço abaixo) e abre o navegador, então `localhost`
      # já resolve corretamente PARA O NAVEGADOR — `getSignedUrl` nunca abre
      # uma conexão de rede de verdade a este endpoint, só assina
      # localmente, então o valor funciona mesmo sendo lido de DENTRO do
      # container da `api` (que não conseguiria abrir essa conexão se
      # tentasse). Em homologação/produção, quem publicar PRECISA
      # sobrescrever esta variável no `.env` com o domínio/IP público real
      # na porta exposta do MinIO — mesmo padrão histórico deste projeto
      # para `SUPABASE_URL` (dev usava `host.docker.internal`, homologação
      # usava a URL pública do projeto Supabase; ver
      # `agent_context/CHANGELOG.md`, entradas de 2026-09-09).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-images}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?defina AUTH_JWT_SECRET no .env}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Sem `ports`: a API só é alcançada pela rede interna do compose (pelo
    # serviço `proxy`, via nome de serviço `api`), nunca diretamente do host.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env}
      # Lidas só pelo script de inicialização abaixo (`docker/mysql/initdb/`,
      # montado em `/docker-entrypoint-initdb.d`) — não são MYSQL_USER/
      # MYSQL_PASSWORD porque essas variáveis da imagem oficial concedem
      # GRANT ALL (superusuário) no banco, mais privilégio do que o usuário
      # de aplicação deve ter em runtime (ver comentário no script).
      MYSQL_APP_USER: ${MYSQL_APP_USER:?defina MYSQL_APP_USER no .env}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?defina MYSQL_APP_PASSWORD no .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    # Sem `ports`: só alcançável pela rede interna do compose (pelo nome de
    # serviço `mysql`) — mesmo padrão já usado pelo serviço `api`.
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      # A primeira subida (volume vazio) roda `initdb` + o script de criação
      # do usuário de aplicação antes do servidor aceitar conexão — medido
      # em ~90s neste ambiente de desenvolvimento; `start_period` maior
      # evita marcar o container como `unhealthy` só por causa desse boot
      # inicial (verificado de verdade, não só documentado — ver relato da
      # tarefa `ajustes/migracao-mysql-infra-compose`).
      start_period: 100s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio-data:/data
    # Diferente de `mysql`/`api` (só rede interna do compose): a porta da
    # API S3 (9000) É publicada para o host — o padrão de upload direto do
    # navegador (SDD § Decisões técnicas e trade-offs — "Upload direto do
    # navegador para o Storage") exige, por natureza, que o Storage seja
    # alcançável por um cliente fora do compose, exatamente como o Supabase
    # Storage original já era um endpoint HTTPS público, não interno (ver
    # `MINIO_ENDPOINT` do serviço `api` acima, e
    # `agent_context/PLAN.md`, tarefa
    # `ajustes/migracao-mysql-minio-endpoint-publico`). Isso não reabre o
    # bucket para escrita anônima nem para listagem: o controle de acesso
    # real continua sendo a policy de leitura pública só de objeto
    # (`docker/minio/init-bucket.sh`) e a exigência de credencial
    # pré-assinada para qualquer `PUT`. O console de administração (9001)
    # continua NÃO publicado — só a API S3 (9000), a única porta que o
    # navegador precisa alcançar.
    ports:
      - "9000:9000"
    healthcheck:
      # A imagem oficial não inclui mais curl/wget (só o binário `mc`, já
      # embarcado) — `mc ready local` é o healthcheck recomendado pelo
      # próprio MinIO no lugar de bater em /minio/health/live via HTTP.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Roda uma vez, cria o bucket de imagens do CMS se ainda não existir, e
  # sai — padrão recomendado pelo próprio MinIO para provisionar bucket no
  # startup do compose (um serviço `mc` de inicialização, não um servidor de
  # vida longa). Não publica nada nem expõe porta; só fala com `minio` pela
  # rede interna do compose.
  #
  # `docker/minio/init-bucket.sh` cria o bucket e, na sequência, aplica uma
  # policy anônima de leitura PÚBLICA só de objeto (`s3:GetObject`, sem
  # `s3:ListBucket`) — equivalente à policy `images_public_read` que o
  # Supabase Storage original tinha (`storage.buckets.public = true` +
  # policy de `select` para todos os papéis — ver
  # `supabase/migrations/20260908200805_enable_rls_and_storage.sql` e
  # `docs/BANCO-DE-DADOS.md` § "Bucket MinIO"). Sem essa policy, o MinIO nega
  # `GET` anônimo por padrão, e a `public_url` gravada em `media_assets`
  # (`MinioMediaAssetsRepository`) teria a FORMA de uma URL pública sem
  # funcionar de fato — LP/painel não conseguiriam exibir `<img src="...">`
  # sem credencial (achado registrado em `agent_context/PLAN.md`, tarefa
  # `ajustes/migracao-mysql-minio-bucket-leitura-publica`). O script usa uma
  # policy JSON própria (`mc anonymous set-json`) em vez da policy canônica
  # `mc anonymous set download`, porque esta última concede também
  # `s3:ListBucket` (listagem pública do bucket inteiro) — confirmado
  # empiricamente via `mc anonymous get-json` — o que exporia a lista
  # completa de arquivos, indo além do que o critério de "pronto" da tarefa
  # permite (ver comentário no próprio script para o detalhe).
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-images}
    volumes:
      - ./docker/minio/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-bucket.sh"]

volumes:
  mysql-data:
  minio-data:
