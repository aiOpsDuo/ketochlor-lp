# Proxy de entrada de produção — mesmo mapa de caminhos do dev server
# (apps/lp/vite.config.ts): `/` → LP, `/admin` → painel, `/api/` → API.
# `root` aponta para um único diretório contendo os dois builds estáticos
# (LP na raiz, painel em `/admin`, ver docker/Dockerfile), evitando o uso de
# `alias` — que exigiria barra final obrigatória e um redirect a mais só
# para normalizar `/admin` (sem barra) em `/admin/`.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # LP pública — SPA: qualquer caminho não encontrado cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Painel — SPA sob /admin, sem redirect: `/admin` (sem barra) e
    # `/admin/` servem o mesmo index.html com 200. Duas location blocks
    # (em vez de um único prefixo `/admin`) para não casar acidentalmente
    # com um caminho não relacionado que só por acaso começa com "admin"
    # (ex.: uma futura rota `/administracao`).
    location = /admin {
        try_files /admin/index.html =404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # API — `apps/api` já expõe suas rotas sob o prefixo global `/api`
    # (main.ts, `app.setGlobalPrefix('api')`); `proxy_pass` sem caminho
    # próprio encaminha a URI recebida sem alterá-la, então `/api/health`
    # chega ao serviço `api` (nome do serviço no docker-compose, não
    # `localhost`) como `/api/health`.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
